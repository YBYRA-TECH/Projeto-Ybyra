<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="/ASSETS/imgs/Nova_logo_sem_tech.png" type="image/x-icon" />
    <link rel="stylesheet" href="/ASSETS/CSS/globalApp.css">
    <link rel="stylesheet" href="/ASSETS/CSS/adicionarLote.css" />
    <title>YBYRA TECH</title>
</head>

<body>
    <div class="painel-principal">
        <aside class="barra-lateral">
            <input type="checkbox" id="menu">
            <label for="menu" class="menu-icon">
                <span></span>
                <span></span>
                <span></span>
            </label>
            <label for="menu-icon" class="logo-logo">
                <img src="/ASSETS/imgs/Nova_logo.png" alt="Logo YBYRA TECH" id="logo" />
            </label>

            <nav class="menu-principal">
                <ul>
                    <li class="item-menu">
                        <a href="/ASSETS/HTML/inicioBI.html">
                            <div class="box-icone">
                                <img src="/ASSETS/imgs/House.png" alt="Ícone Início" />
                            </div>
                            <span>Início</span>
                        </a>
                    </li>
                    <li class="item-menu ativo">
                        <a href="/ASSETS/HTML/relatorios.html">
                            <div class="box-icone">
                                <img src="/ASSETS/imgs/document.png" alt="Ícone relatorios" />
                            </div>
                            <span>Lotes</span>
                        </a>
                    </li>

                    <li class="item-menu">
                        <a href="/ASSETS/HTML/tarefas.html">
                            <div class="box-icone">
                                <img src="/ASSETS/imgs/clipboard.png  " alt="Ícone Tarefas" />
                            </div>
                            <span>Tarefas</span>
                        </a>
                    </li>

                    <li class="item-menu">
                        <a href="/ASSETS/HTML/insercaoDados.html">
                            <div class="box-icone">
                                <img src="/ASSETS/imgs/camera_insercao.png" alt="Ícone Inserir Dados" ">
                            </div>
                            <span>Inserir Dados</span>
                        </a>
                    </li>
                    <li class=" item-menu">
                        <a href="funcionarios.html">
                            <div class="box-icone">
                                <img src="/ASSETS/imgs/icone_funcionario.png" alt="Ícone Configurações" />
                            </div>
                            <span>Funcionários</span>
                        </a>
                    </li>
                    <li class=" item-menu">
                        <a href="perfil.html">
                            <div class="box-icone">
                                <img src="/ASSETS/imgs/icone_usuario.png" alt="Ícone Configurações" />
                            </div>
                            <span>Perfil</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <main class="area-conteudo">
            <div class="conteudo-principal-header">
                <!-- adicionado o icone de voltar para a pagina de alterar tarefa da industria -->
                <a href="/ASSETS/HTML/relatorios.html">
                    <img src="/ASSETS/imgs/voltar.png" alt="voltar" id="voltar">
                </a>
                <h1>Adicionar</h1>
                <div class="area-icones">
                    <input type="checkbox" id="menu-notificacoes">
                    <label for="menu-notificacoes">
                        <img src="/ASSETS/imgs/notificacoes.png" alt="Notificações">
                    </label>
                    <div id="notificacoes">
                        <h1>Notificações</h1>
                        <div>Murilo adicionou uma tarefa</div>
                        <div>Guilherme concluiu uma tarefa</div>
                        <div>Emilly concluiu uma tarefa</div>
                    </div>
                </div>
            </div>

            <section class="detalhesPainel">
                <form action="" method="post">
                    <div class="formulario-detalhes">

                        <div class="area-detalhes">
                            <h3 class="subtitulo-secao">Não recomendamos a inserção de lotes manualmente, pois o BI não conseguira dados.</h3>
                            <div class="detalhes-campos">
                                <div>
                                    <div class="campo">
                                        <label for="nome">Nome</label>
                                       <input type="text" id="nome" placeholder="Digite o nome do lote">
                                    </div>

                                    <div class="campo">
                                        <label for="Eficiencia">Eficiência</label>
                                        <input type="text" id="Eficiencia" placeholder="Ex: 95% ou Alta">
                                    </div>
                                    <div class="campo">
                                        <label for="planejado">Planejado</label>
                                        <input type="text" id="planejado" placeholder="Ex: Produção, Logística, Administrativo">
                                    </div>
                                </div>
                                <div>
                                    <div class="campo">
                                        <label for="responsavel">Responsável</label>
                                        <input type="text" id="responsavel" placeholder="Ex: email@exemplo.com ou (11) 98765-4321">
                                           
                                    </div>
                                    <div class="campo">
                                        <label for="producao">Produção</label>
                                        <input type="text" id="producao" placeholder="Ex: 150 unidades/dia">
                                    </div>
                                    
                                    <div class="campo">
                                        <label for="observacao">Observação</label>
                                        <input type="text" id="observacao" placeholder="Ex: rel-123-abc ou Nome do relatório">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="area-problemas">
                            
                            <label for="problemas">Problemas</label>
                            <input type="text" id="problemas" placeholder="Descreva problemas identificados">
                        </div>
                    </div>
                   
                    <a href="relatorios.html" class="btn-enviar">Confirmar</a>
                   
                </form>
            </section>
        </main>
    </div>
</body>

</html>
