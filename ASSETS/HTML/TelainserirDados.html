<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="/ASSETS/imgs/Nova logo Sem tech.png" type="image/x-icon" />
    <link rel="stylesheet" href="/ASSETS/CSS/globalApp.css">
    <link rel="stylesheet" href="/ASSETS/CSS/TelaIserirDados.css" />
    <title>YBYRA TECH</title>
</head>

<body>
    <div class="painel-principal">
        <aside class="barra-lateral">
            <input type="checkbox" id="menu">
            <label for="menu" class="menu-icon">
              <span></span>
              <span></span>
              <span></span>
            </label>
            <label for="menu-icon" class="logo-logo">
              <img src="/ASSETS/imgs/Nova logo.png" alt="Logo YBYRA TECH" id="logo" />
            </label>
              <nav class="menu-principal">
                  <ul>
                      <li class="item-menu">
                          <a href="/ASSETS/HTML/inicioBI.html">
                              <div class="box-icone">
                                  <img src="/ASSETS/imgs/House.png" alt="Ícone Início" />
                              </div>
                              <span>Início</span>
                          </a>
                      </li>
                      <li class="item-menu">
                          <a href="/ASSETS/HTML/relatorios.html">
                              <div class="box-icone">
                                  <img src="/ASSETS/imgs/document.png" alt="Ícone relatorios" />
                              </div>
                              <span>Relatórios</span>
                          </a>
                      </li>
      
                      <li class="item-menu">
                          <a href="/ASSETS/HTML/tarefas.html">
                              <div class="box-icone">
                                  <img src="/ASSETS/imgs/clipboard.png  " alt="Ícone Tarefas" />
                              </div>
                              <span>Tarefas</span>
                          </a>
                      </li>
      
                      <li class="item-menu ativo">
                          <a href="/ASSETS/HTML/insercaoDados.html">
                              <div class="box-icone">
                                  <img src="/ASSETS/imgs/camera_insercao.png" alt="Ícone Inserir Dados" ">
                              </div>
                              <span>Inserir Dados</span>
                          </a>
                      </li>
                      <li class=" item-menu">
                          <a href="configuraçoes.html">
                              <div class="box-icone">
                                  <img src="/ASSETS/imgs/configuracoes.png" alt="Ícone Configurações" />
                              </div>
                              <span>Configurações</span>
                          </a>
                      </li>
                  </ul>
              </nav>
          </aside>

        <main class="area-conteudo">
            <div class="conteudo-principal-header">

                <div class="area">
                    <a href="insercaoDados.html">
                        <img src="/ASSETS/imgs/voltar.png" alt="voltar" id="voltar">
                    </a>
                    <div class="area-icones">
                        <input type="checkbox" id="menu-notificacoes">
                        <label for="menu-notificacoes">
                            <img src="/ASSETS/imgs/notificacoes.png" alt="Notificações">
                        </label>
                        <div id="notificacoes">
                            <h1>Notificações</h1>
                            <div>Murilo adicionou uma tarefa</div>
                            <div>Guilherme concluiu uma tarefa</div>
                            <div>Emilly concluiu uma tarefa</div>
                        </div>
                    </div>

                </div>
            </div>

            <section class="detalhes-upload-painel">

                <h2 class="titulo-secao">Arquivo escolhido</h2>

                <div class="arquivo-preview">
                    <img src="/ASSETS/imgs/imagem modelo arquivo .jpg" alt="Pré-visualização do Controle de Produção"
                        class="preview-img">
                </div>

                <div class="formulario-detalhes">

                    <div class="area-detalhes">
                        <h3 class="subtitulo-secao">Detalhes</h3>

                        <div class="campo">
                            <label for="titulo">Título</label>
                            <input type="text" id="titulo" value="" placeholder="Digite o Assunto">
                        </div>

                        <div class="campo">
                            <label for="categoria">Categoria</label>
                            <input type="text" id="categoria" value="" placeholder="Digite a categoria">
                        </div>

                        <div class="campo">
                            <label for="prioridade">Prioridade</label>
                            <input type="text" id="prioridade" value="" placeholder="Digite a prioridade">
                        </div>
                    </div>

                    <div class="area-descricao">
                        <h3 class="subtitulo-secao">Descrição</h3>
                        <h3 style="opacity: 0;">Espaço</h3>
                        <textarea class="texto-descricao" placeholder="coloque aqui a descrição do arquivo"></textarea>

                        <a href="/ASSETS/HTML/insercaoDados.html" class="link-inserir"><button class="btn-enviar">Enviar
                                Arquivo</button></a>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>

</html>
