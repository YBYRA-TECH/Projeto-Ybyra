<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="/ASSETS/imgs/Nova logo Sem tech.png" type="image/x-icon" />
  <link rel="stylesheet" href="/ASSETS/CSS/globalApp.css">
    <link rel="stylesheet" href="/ASSETS/CSS/insercaoDados.css" />
  <title>YBYRA TECH</title>
</head>

<body>
  <div class="painel-principal">
    <aside class="barra-lateral">
      <input type="checkbox" id="menu">
      <label for="menu" class="menu-icon">
        <span></span>
        <span></span>
        <span></span>
      </label>
      <label for="menu-icon" class="logo-logo">
        <img src="/ASSETS/imgs/Nova logo.png" alt="Logo YBYRA TECH" id="logo" />
      </label>
        <nav class="menu-principal">
            <ul>
                <li class="item-menu">
                    <a href="/ASSETS/HTML/inicioBI.html">
                        <div class="box-icone">
                            <img src="/ASSETS/imgs/House.png" alt="Ícone Início" />
                        </div>
                        <span>Início</span>
                    </a>
                </li>
                <li class="item-menu">
                    <a href="/ASSETS/HTML/relatorios.html">
                        <div class="box-icone">
                            <img src="/ASSETS/imgs/document.png" alt="Ícone relatorios" />
                        </div>
                        <span>Relatórios</span>
                    </a>
                </li>

                <li class="item-menu">
                    <a href="/ASSETS/HTML/tarefas.html">
                        <div class="box-icone">
                            <img src="/ASSETS/imgs/clipboard.png  " alt="Ícone Tarefas" />
                        </div>
                        <span>Tarefas</span>
                    </a>
                </li>

                <li class="item-menu ativo">
                    <a href="/ASSETS/HTML/insercaoDados.html">
                        <div class="box-icone">
                            <img src="/ASSETS/imgs/camera_insercao.png" alt="Ícone Inserir Dados" ">
                        </div>
                        <span>Inserir</span>
                        <span>Dados</span>
                    </a>
                </li>
                <li class=" item-menu">
                    <a href="#">
                        <div class="box-icone">
                            <img src="/ASSETS/imgs/configuracoes.png" alt="Ícone Configurações" />
                        </div>
                        <span>Configurações</span>
                    </a>
                </li>
            </ul>
        </nav>
    </aside>


    <main class="area-conteudo">
      <div class="conteudo-principal-header">
        <header class="header-principal">
          <div class="busca-filtros">
            <div class="busca-relatorios">
              <input type="text" placeholder="Buscar Relatórios" title="Busca"/>
              <button class="icone-busca">
                <img src="/ASSETS/imgs/Research.png" alt="Lupa" title="lupa">
              </button>
            </div>
            <select name="categorias" id="categorias" title="Categorias">
              <option value="" disabled selected hidden>Todas as Categorias</option>
              <option value="">Área Fria</option>
              <option value="">Área Quente</option>
            </select>
            <select name="periodo" id="periodo" title="Período">
              <option value="" disabled selected hidden>Período</option>
              <option value="">Manhã</option>
              <option value="">Tarde</option>
              <option value="">Noite</option>
            </select>
            <select name="prioridade" id="prioridade" title="Prioridade">
              <option value="" disabled selected hidden>Prioridade</option>
              <option value="">Baixa</option>
              <option value="">Média</option>
              <option value="">Alta</option>
            </select>
            <button class="btn-buscar" title="buscar">Buscar</button>
          </div>

          <div class="area-icones">
            <input type="checkbox" id="menu-notificacoes">
            <label for="menu-notificacoes">
              <img src="/ASSETS/imgs/notificacoes.png" alt="Notificações" title="Notificações">
            </label>
            <div id="notificacoes">
              <h1>Notificações</h1>
              <div>Murilo adicionou uma tarefa</div>
              <div>Guilherme concluiu uma tarefa</div>
              <div>Emilly concluiu uma tarefa</div>
            </div>
          </div>
        </header>
      </div>

      <section class="painel">
        <div class="area-upload-arquivo">
          <input type="file" id="upload" placeholder="Escolher arquivo" />
          <a href="/ASSETS/HTML/TelainserirDados.html"><button class="btn-escolher-arquivo" title="Confirmar Arquivo">Confimar Arquivo</button></a>

        </div>
        <h1>Recentes</h1>
        <div class="area-upload-recentes">
          <img src="/ASSETS/imgs/imagem modelo arquivo .jpg" alt="imagem papel" title="imagem">
          <p>Digitalizar novos documentos</p>
        </div>
      </section>
    </main>
  </div>
</body>

</html>
