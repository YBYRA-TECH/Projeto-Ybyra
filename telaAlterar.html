<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="./imgs/Nova logo Sem tech.png" type="image/x-icon" />
    <link rel="stylesheet" href="globalApp.css">
    <link rel="stylesheet" href="telaAlterar.css" />
    <title>YBYRA TECH</title>
</head>

<body>
    <div class="painel-principal">
        <aside class="barra-lateral">
            <input type="checkbox" id="menu">
            <label for="menu" class="menu-icon">
                <span></span>
                <span></span>
                <span></span>
            </label>
            <label for="menu-icon" class="logo-logo">
                <img src="./imgs/Nova logo.png" alt="Logo YBYRA TECH" id="logo" />
            </label>

            <nav class="menu-principal">
                <ul>
                    <li class="item-menu">
                        <a href="inicioBI.html">
                            <div class="box-icone">
                                <img src="./imgs/House.png" alt="Ícone Início" />
                            </div>
                            <span>Início</span>
                        </a>
                    </li>
                    <li class="item-menu">
                        <a href="relatorios.html">
                            <div class="box-icone">
                                <img src="./imgs/document.png" alt="Ícone relatorios" />
                            </div>
                            <span>Relatórios</span>
                        </a>
                    </li>

                    <li class="item-menu">
                        <a href="tarefas.html">
                            <div class="box-icone">
                                <img src="./imgs/clipboard.png  " alt="Ícone Tarefas" />
                            </div>
                            <span>Tarefas</span>
                        </a>
                    </li>

                    <li class="item-menu ativo">
                        <a href="insercaoDados.html">
                            <div class="box-icone">
                                <img src="./imgs/camera_insercao.png" alt="Ícone Inserir Dados" ">
                            </div>
                            <span>Inserir Dados</span>
                            </a>
                        </li>
<!-- 
          <li class=" item-menu">
                                <a href="#">
                                    <div class="box-icone">
                                        <img src="" alt="Ícone IA" />
                                    </div>
                                    <span>ChatBot</span>
                                </a>
                    </li>

                    <li class="item-menu" style="margin-top: 6.5rem;">
                        <a href="#">
                            <div class="box-icone">
                                <img src="./imgs/Help.png" alt="Ícone Ajuda" />
                            </div>
                            <span>Ajuda</span>
                        </a>
                    </li> -->

                    <li class="item-menu">
                        <a href="#">
                            <div class="box-icone">
                                <img src="./imgs/configuracoes.png" alt="Ícone Configurações" />
                            </div>
                            <span>Configurações</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <main class="area-conteudo">
            <div class="conteudo-principal-header">
                    <div class="area-icones-usuario">
                        <input type="checkbox" id="menu-notificacoes">
                        <label for="menu-notificacoes">
                            <img src="./imgs/notificacoes.png" alt="Notificações">
                        </label>
                        <div id="notificacoes">
                          <h1>Notificações</h1>
                          <div>Murilo adicionou uma tarefa</div>
                          <div>Guilherme concluiu uma tarefa</div>
                          <div>Emilly concluiu uma tarefa</div>
                        </div>
                    </div>
            </div>

            <section class="detalhes-upload-painel">

                <div class="formulario-detalhes">

                    <div class="area-detalhes">
                        <h3 class="subtitulo-secao">Detalhes</h3>
                        <div class="detalhes-campos">
                            <div>
                                <div class="campo">
                                    <label for="">Prioridade</label>
                                    <select class="filtro-select">
                                        <option value="" disabled selected hidden>Prioridade</option>
                                        <option value="">Não Iniciada</option>
                                        <option value="">Em Andamento</option>
                                        <option value="">Concluída</option>
                                    </select>
                                </div>

                                <div class="campo">
                                    <label for="nome-tarefa">Nome da Tarefa</label>
                                    <input type="text" id="nome-tarefa" value="" placeholder="Digite o Nome da Tarefa">
                                </div>
                            </div>
                            <div>
                                <div class="campo">
                                    <label for="responsavel">Responsável</label>
                                    <input type="text" value="" id="responsavel" placeholder="Digite o Nome do Responsável">
                                </div>
                                <div class="campo">
                                    <label for="data-tarefa">Data da Tarefa</label>
                                    <input type="date" id="data-tarefa" value="">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="area-descricao">
                        <h3 class="subtitulo-secao">Descrição</h3>
                        <h3 style="opacity: 0;">Espaço</h3>
                        <textarea class="texto-descricao" placeholder="coloque aqui a descrição da tarefa"></textarea>

                        <a href="insercaoDados.html" class="link-inserir"><button class="btn-enviar">Confirmar</button></a>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>

</html>
