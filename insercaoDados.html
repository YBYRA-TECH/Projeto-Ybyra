  <link rel="stylesheet" href="globalApp.css">
  <link rel="stylesheet" href="insercaoDados.css" />

</head>

<body>
  <div class="painel-principal">
    <aside class="barra-lateral">
      <input type="checkbox" id="menu">

      </label>

      <nav class="menu-principal">
        <ul>
          <li class="item-menu">
            <a href="inicioBI.html">
              <div class="box-icone">
                <img src="./imgs/House.png" alt="Ícone Início" />
              </div>
              <span>Início</span>
            </a>
          </li>
          <li class="item-menu">
            <a href="relatorios.html">
              <div class="box-icone">
                <img src="./imgs/document.png" alt="Ícone relatorios" />
              </div>
              <span>Relatórios</span>
            </a>
          </li>

          <li class="item-menu">
            <a href="tarefas.html">
              <div class="box-icone">
                <img src="./imgs/clipboard.png  " alt="Ícone Tarefas" />
              </div>
              <span>Tarefas</span>
            </a>
          </li>

          <li class="item-menu ativo">
            <a href="insercaoDados.html">
              <div class="box-icone">
                <img src="./imgs/camera_insercao.png" alt="Ícone Inserir Dados">
              </div>
              <span id="span1">Inserir</span>
              <span>Dados</span>
            </a>
          </li>
          <!--       
                <li class=" item-menu">
                <a href="#">
                  <div class="box-icone">
                    <img src="" alt="Ícone IA" />
                  </div>
                  <span>ChatBot</span>
                </a>
          </li>

          <li class="item-menu" style="margin-top: 6.5rem;">
            <a href="#">
              <div class="box-icone">
                <img src="./imgs/Help.png" alt="Ícone Ajuda" />
              </div>
              <span>Ajuda</span>
            </a>
          </li>
          -->
          <li class="item-menu">
            <a href="#">
              <div class="box-icone">
                <img src="./imgs/configuracoes.png" alt="Ícone Configurações" />
              </div>
              <span>Configurações</span>
            </a>
          </li>
        </ul>
      </nav>

    </aside>

    <main class="area-conteudo">
      <div class="conteudo-principal-header">
        <header class="header-principal">
          <div class="busca-filtros">
            <div class="busca-relatorios">
              <input type="text" placeholder="Buscar Relatórios" />
              <button class="icone-busca">
                <img src="./imgs/Research.png" alt="Lupa">
              </button>
            </div>
            <select name="categorias" id="categorias">
              <option value="" disabled selected hidden>Todas as Categorias</option>
              <option value="">Área Fria</option>
              <option value="">Área Quente</option>
            </select>
            <select name="periodo" id="periodo">
              <option value="" disabled selected hidden>Período</option>
              <option value="">Manhã</option>
              <option value="">Tarde</option>
              <option value="">Noite</option>
            </select>
            <select name="prioridade" id="prioridade">
              <option value="" disabled selected hidden>Prioridade</option>
              <option value="">Baixa</option>
              <option value="">Média</option>
              <option value="">Alta</option>
            </select>
            <button class="btn-buscar">Buscar</button>
          </div>

          <div class="area-icones">
            <input type="checkbox" id="menu-notificacoes">
            <label for="menu-notificacoes">
              <img src="./imgs/notificacoes.png" alt="Notificações" title="Notificações">
            </label>
            <div id="notificacoes">
              <h1>Notificações</h1>
              <div>Murilo adicionou uma tarefa</div>
              <div>Guilherme concluiu uma tarefa</div>
              <div>Emilly concluiu uma tarefa</div>
            </div>
          </div>
        </header>
      </div>

      <section class="painel">
        <div class="area-upload-arquivo">
          <input type="file" id="upload" placeholder="Escolher arquivo" />
          <a href="TelainserirDados.html"><button class="btn-escolher-arquivo" title="Confirmar Arquivo">Confimar Arquivo</button></a>

        </div>
        <h1>Recentes</h1>
        <div class="area-upload-recentes">
          <img src="./imgs/imagem modelo arquivo .jpg" alt="imagem papel" title="imagem">
          <p>Digitalizar novos documentos</p>
        </div>
      </section>
