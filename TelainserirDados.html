            <nav class="menu-principal">
                <ul>
                    <li class="item-menu">
                        <a href="inicio.html">
                            <div class="box-icone">
                                <img src="./imgs/House.png" alt="Ícone Início" />
                            </div>
                            <span>Início</span>
                        </a>
                    </li>
                    <li class="item-menu ativo">
                        <a href="relatorios.html">

                    <li class="item-menu">
                        <a href="tarefas.html">
                            <div class="box-icone">
                                <img src="./imgs/clipboard.png  " alt="Ícone Tarefas" />
                            </div>
                            <span>Tarefas</span>
                        </a>
                    </li>

                    <li class="item-menu">
                        <a href="insercaoDados.html">
                            <div class="box-icone">
                                <img src="./imgs/camera_insercao.png" alt="Ícone Inserir Dados" ">
              </div>
              <span>Inserir Dados</span>
            </a>
          </li>
<!-- 
          <li class=" item-menu">
                                <a href="#">
                                    <div class="box-icone">
                                        <img src="" alt="Ícone IA" />
                                    </div>
                                    <span>ChatBot</span>
                                </a>
                    </li>

                    <li class="item-menu" style="margin-top: 6.5rem;">
                        <a href="#">
                            <div class="box-icone">
                                <img src="./imgs/Help.png" alt="Ícone Ajuda" />
                            </div>
                            <span>Ajuda</span>
                        </a>
                    </li> -->

                    <li class="item-menu">
                        <a href="#">
                            <div class="box-icone">
                                <img src="./imgs/configuracoes.png" alt="Ícone Configurações" />
                            </div>
                            <span>Configurações</span>
                        </a>
                    </li>
                </ul>
            </nav>
            <div class="overlay"></div>
        </aside>

        <main class="area-conteudo">
            <div class="conteudo-principal-header">
                <header class="header-principal">
                    <div class="busca-filtros">
                        <div class="busca-relatorios">
                            <input type="text" placeholder="Buscar Relatórios" />
                            <button class="icone-busca">
                                <img src="./imgs/Research.png" alt="omagem lupa" />
                            </button>
                        </div>
                        <select name="categorias">
                            <option value="" disabled selected hidden>Todas as Categorias</option>
                            <option value="">Área Fria</option>
                            <option value="">Área Quente</option>
                        </select>
                        <select name="periodo">
                            <option value="" disabled selected hidden>Período</option>
                            <option value="">Manhã</option>
                            <option value="">Tarde</option>
                            <option value="">Noite</option>
                        </select>
                        <select name="prioridade">
                            <option value="" disabled selected hidden>Prioridade</option>
                            <option value="">Baixa</option>
                            <option value="">Média</option>
                            <option value="">Alta</option>
                        </select>
                        <button class="btn-buscar">Buscar</button>
                    </div>

                    <!-- <div class="icones-header-direita">
                        <i class="fa-solid fa-bell icone-notificacao"></i>
                        <i class="fa-solid fa-circle-user icone-usuario"></i>
                    </div> -->
                    <div class="icones-header-direita">
                        <img src="./imgs/notificacoes.png" alt="imagem sino">
                        <!-- <img src="./imgs/icone_usuario.png" alt="imagem usuario"> -->
                    </div>

                <div class="arquivo-preview">
                    <img src="" alt="Pré-visualização do Controle de Produção" class="preview-img">
                </div>

                <div class="formulario-detalhes">

                    <div class="area-detalhes">
                        <h3 class="subtitulo-secao">Detalhes</h3>

                        <div class="campo">
                            <label for="titulo">Título</label>
                            <input type="text" id="titulo" value="" placeholder="Digite o Assunto">
                        </div>

                        <div class="campo">
                            <label for="categoria">Categoria</label>
                            <input type="text" id="categoria" value="" placeholder="Digite a categoria">
                        </div>

                        <div class="campo">
                            <label for="prioridade">Prioridade</label>
                            <input type="text" id="prioridade" value="" placeholder="Digite a prioridade">
                        </div>
                    </div>

                    <div class="area-descricao">
                        <h3 class="subtitulo-secao">Descrição</h3>
                        <h3 style="opacity: 0;">Espaço</h3>
                        <textarea class="texto-descricao">coloque aqui a descrição do arquivo    
                        </textarea>

                        <a href="insercaoDados.html" class="link-inserir"><button class="btn-enviar">Enviar
                                Arquivo</button></a>
                    </div>
                </div>
            </section>
