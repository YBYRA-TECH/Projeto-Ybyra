<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./imgs/Nova logo Sem tech.png" type="image/x-icon" />
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="telaSeparação.CSS" />
  <title>YBYRA TECH</title>
</head>
<body>
    <header>
        <img src="./imgs/Nova logo.png" alt="Logo Ybyra Tech" style="width: 8.125rem; max-width: 35vw; height: auto" />
        <input type="checkbox" id="menu">
        <label for="menu" class="menu-icon">☰</label>
        <nav class="menu-links" >
          <a href="./index.html">Conheça o App</a>
          <a href="./telaSeparação.html">Cadastre-se</a>
          <a href="./telaSeparação.html" style="color: aliceblue; font-size: 1rem" id="botao-login">Acesse a sua conta</a>
        </nav>
      </header>

      <main>
        <!-- A navegação é garantida pela tag <a>, não mais pelo <form> -->
        <a href="cadastroIndustria.html" class="flex-1">
            <div class="industria">
                <h2 class="selection-title">Indústria</h2>
                <p style="color: #666; font-size: 0.9rem; margin-bottom: 1.5rem;">Cadastre-se como uma empresa ou indústria parceira.</p>
                <button type="button">Continuar como Indústria</button>
            </div>
        </a>

        <!-- A navegação é garantida pela tag <a>, não mais pelo <form> -->
        <a href="cadastroUsuario.html" class="flex-1">
            <div class="usuario">
                <h2 class="selection-title">Usuário Comum</h2>
                <p>Cadastre-se como um usuário comum para acessar o app.</p>
                <button type="button">Continuar como Usuário</button>
            </div>
        </a>
